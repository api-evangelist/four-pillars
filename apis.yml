description: 'Four Pillars is a research-driven blockchain enterprise headquartered in Asia, operating
  through three divisions: FP Research publishes primary analysis of crypto protocols, markets, and
  policy with deep regional expertise across Korea and the broader Asian market; FP Validated runs
  validator and node infrastructure across proof-of-stake networks, pairing research with live operations;
  and FP Institution advises banks, financial institutions, and corporates on blockchain strategy. The
  firm serves founders, funds, and regulators, and is a portfolio company of Pantera Capital. It is a
  research and advisory business rather than a developer-facing API platform, and publishes no public
  developer API, SDK, or documentation portal as of this enrichment pass.'
